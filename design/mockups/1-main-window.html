<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>方向预览 1/3 · 主窗口</title>
<style>
  :root{
    --bg:#FAF9F5; --surface:#FFFFFF; --surface2:#F0EEE6; --border:#E5E3DB;
    --text:#1F1E1D; --text2:#6B6A67; --clay:#D97757; --clay-dim:#F0D9CE;
    --green:#5F8B6E;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:#DDD9CC; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:"Segoe UI","Microsoft YaHei UI",sans-serif; color:var(--text);
  }
  .label{position:fixed; top:24px; left:24px; font-size:13px; color:#8a8878; letter-spacing:.02em;}
  .win{
    width:380px; background:var(--bg); border-radius:16px; overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.22), 0 2px 8px rgba(0,0,0,.12);
    border:1px solid var(--border);
  }
  .titlebar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px 10px; -webkit-app-region:drag;
  }
  .brand{display:flex; align-items:center; gap:8px;}
  .brand .mark{width:20px;height:20px;border-radius:6px;background:var(--clay);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:600;font-family:Georgia,serif;}
  .brand .name{font-family:Georgia,"Times New Roman",serif; font-size:15px; letter-spacing:.01em;}
  .status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--green);}
  .win-controls{display:flex;gap:14px;padding:0 4px 0 10px;color:var(--text2);font-size:13px;}

  .mic-area{padding:28px 24px 20px; text-align:center;}
  .mic-btn{
    width:96px;height:96px;border-radius:50%;margin:0 auto 14px;
    background:radial-gradient(circle at 35% 30%, #E8A184, var(--clay));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 8px var(--clay-dim), 0 12px 24px rgba(217,119,87,.25);
    cursor:pointer;
  }
  .mic-btn svg{width:34px;height:34px;fill:#fff;}
  .hint{font-size:13px;color:var(--text2);}
  .hint kbd{
    background:var(--surface2); border:1px solid var(--border); border-radius:5px;
    padding:2px 7px; font-size:12px; font-family:Consolas,monospace; color:var(--text);
  }

  .history{padding:6px 16px 12px;}
  .history-title{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text2); padding:8px 6px 6px;}
  .item{
    display:flex; gap:10px; align-items:flex-start; padding:10px 10px; border-radius:10px;
    cursor:default;
  }
  .item:hover{background:var(--surface2);}
  .item .t{font-size:11px; color:var(--text2); width:38px; flex:none; padding-top:2px;}
  .item .txt{font-size:13.5px; line-height:1.5; color:var(--text);}
  .item .copy{margin-left:auto; opacity:0; font-size:12px; color:var(--clay); flex:none;}
  .item:hover .copy{opacity:1;}

  .bottombar{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 14px; border-top:1px solid var(--border); background:var(--surface2);
  }
  .chips{display:flex; gap:8px;}
  .chip{font-size:11px; color:var(--text2); background:var(--bg); border:1px solid var(--border); padding:3px 9px; border-radius:20px;}
  .icons{display:flex; gap:16px; color:var(--text2);}
  .icons svg{width:16px;height:16px; fill:currentColor; cursor:pointer;}
  .icons svg:hover{fill:var(--text);}
  .tip{position:relative;}
  .tip::after{
    content:attr(data-tip); position:absolute; bottom:26px; left:50%; transform:translateX(-50%);
    background:var(--text); color:#fff; font-size:11px; padding:4px 8px; border-radius:6px;
    white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .12s;
  }
  .tip:hover::after{opacity:.92;}
</style>
</head>
<body>
<div class="label">方向预览 1 / 3 —— 主窗口（点一下托盘图标弹出的这个）</div>
<div class="win">
  <div class="titlebar">
    <div class="brand"><div class="mark">超</div><div class="name">超语音</div></div>
    <div style="display:flex;align-items:center;gap:12px;">
      <div class="status"><span class="dot"></span>就绪</div>
    </div>
  </div>

  <div class="mic-area">
    <div class="mic-btn">
      <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
    </div>
    <div class="hint">按 <kbd>Alt</kbd> + <kbd>空格</kbd> 说话，松开即输入</div>
  </div>

  <div class="history">
    <div class="history-title">最近</div>
    <div class="item">
      <div class="t">14:32</div>
      <div class="txt">帮我把这段会议纪要整理成三条要点，发到项目群里。</div>
      <div class="copy tip" data-tip="复制">⧉</div>
    </div>
    <div class="item">
      <div class="t">14:18</div>
      <div class="txt">今天下午三点和张总对齐一下下周的排期。</div>
      <div class="copy tip" data-tip="复制">⧉</div>
    </div>
    <div class="item">
      <div class="t">13:55</div>
      <div class="txt">收到，稍后回复邮件确认合同细节。</div>
      <div class="copy tip" data-tip="复制">⧉</div>
    </div>
  </div>

  <div class="bottombar">
    <div class="chips">
      <div class="chip">模型 · tiny.en</div>
      <div class="chip">中 / EN</div>
    </div>
    <div class="icons">
      <div class="tip" data-tip="历史记录"><svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 1 0 9 9h-2a7 7 0 1 1-7-7v4l5-5-5-5v3z"/></svg></div>
      <div class="tip" data-tip="设置"><svg viewBox="0 0 24 24"><path d="M12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7zm7.4-3.5a7.4 7.4 0 0 0-.13-1.4l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-2.4-1.4L14 2h-4l-.4 2.7a7.6 7.6 0 0 0-2.4 1.4l-2.5-1-2 3.5 2.1 1.6a7.4 7.4 0 0 0 0 2.8L2.7 15l2 3.5 2.5-1a7.6 7.6 0 0 0 2.4 1.4L10 22h4l.4-2.7a7.6 7.6 0 0 0 2.4-1.4l2.5 1 2-3.5-2.1-1.6a7.4 7.4 0 0 0 .13-1.4z"/></svg></div>
      <div class="tip" data-tip="退出"><svg viewBox="0 0 24 24"><path d="M13 3h-2v10h2V3zm4.83 2.17-1.42 1.42A6.92 6.92 0 0 1 19 12a7 7 0 1 1-11.66-5.24L5.92 5.34A9 9 0 1 0 18 5.34l-.17-.17z"/></svg></div>
    </div>
  </div>
</div>
</body>
</html>
