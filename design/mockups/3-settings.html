<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>方向预览 3/3 · 设置页</title>
<style>
  :root{
    --bg:#FAF9F5; --surface:#FFFFFF; --surface2:#F0EEE6; --border:#E5E3DB;
    --text:#1F1E1D; --text2:#6B6A67; --clay:#D97757; --clay-dim:#F0D9CE;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#DDD9CC; min-height:100vh; display:flex; align-items:center; justify-content:center; font-family:"Segoe UI","Microsoft YaHei UI",sans-serif; color:var(--text);}
  .label{position:fixed; top:24px; left:24px; font-size:13px; color:#8a8878;}
  .win{
    width:720px; height:460px; background:var(--bg); border-radius:14px; overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.22); border:1px solid var(--border);
    display:flex;
  }
  .rail{
    width:180px; background:var(--surface2); border-right:1px solid var(--border);
    padding:18px 10px; display:flex; flex-direction:column; gap:2px;
  }
  .rail .brand{font-family:Georgia,"Times New Roman",serif; font-size:14px; padding:4px 10px 16px; color:var(--text2);}
  .navitem{
    display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px;
    font-size:13.5px; color:var(--text2); cursor:default;
  }
  .navitem svg{width:16px;height:16px;fill:currentColor;flex:none;}
  .navitem.active{background:var(--surface); color:var(--clay); font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.05);}
  .navitem:not(.active):hover{background:rgba(0,0,0,.03); color:var(--text);}

  .content{flex:1; padding:26px 32px; overflow:auto;}
  .section{margin-bottom:26px;}
  .section h3{font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--text2); margin-bottom:12px; font-weight:600;}
  .row{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:12px 16px; margin-bottom:8px;
  }
  .row .label2{font-size:13.5px;}
  .row .desc{font-size:11.5px; color:var(--text2); margin-top:2px;}
  .keys{display:flex; gap:5px;}
  .keys kbd{background:var(--surface2); border:1px solid var(--border); border-radius:5px; padding:3px 8px; font-size:12px; font-family:Consolas,monospace;}

  .switch{width:36px; height:20px; border-radius:20px; background:var(--clay); position:relative; flex:none;}
  .switch::after{content:"";position:absolute; width:16px;height:16px;border-radius:50%;background:#fff; top:2px; right:2px;}
  .switch.off{background:#D8D5C9;}
  .switch.off::after{left:2px; right:auto;}

  select.fake{
    background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:6px 10px;
    font-size:13px; color:var(--text);
  }
</style>
</head>
<body>
<div class="label">方向预览 3 / 3 —— 设置页（左边图标条不重复显示当前页名字，因为已经点进来了）</div>
<div class="win">
  <div class="rail">
    <div class="brand">超语音</div>
    <div class="navitem"><svg viewBox="0 0 24 24"><path d="M12 2 2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>通用</div>
    <div class="navitem active"><svg viewBox="0 0 24 24"><path d="M12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7zm7.4-3.5a7.4 7.4 0 0 0-.13-1.4l2.1-1.6-2-3.5-2.5 1a7.6 7.6 0 0 0-2.4-1.4L14 2h-4l-.4 2.7a7.6 7.6 0 0 0-2.4 1.4l-2.5-1-2 3.5 2.1 1.6a7.4 7.4 0 0 0 0 2.8L2.7 15l2 3.5 2.5-1a7.6 7.6 0 0 0 2.4 1.4L10 22h4l.4-2.7a7.6 7.6 0 0 0 2.4-1.4l2.5 1 2-3.5-2.1-1.6a7.4 7.4 0 0 0 .13-1.4z"/></svg>快捷键</div>
    <div class="navitem"><svg viewBox="0 0 24 24"><path d="M4 4h16v4H4zM4 10h10v10H4zM16 10h4v4h-4zM16 16h4v4h-4z"/></svg>模型</div>
    <div class="navitem"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zm0 3a2 2 0 1 1 0 4 2 2 0 0 1 0-4zm0 12c-2.2 0-4.2-1-5.5-2.7 1.6-1.1 3.5-1.7 5.5-1.7s3.9.6 5.5 1.7C16.2 17 14.2 18 12 18z"/></svg>外观</div>
    <div class="navitem"><svg viewBox="0 0 24 24"><path d="M11 7h2v2h-2zm0 4h2v6h-2zm1-9a10 10 0 1 0 0 20 10 10 0 0 0 0-20z"/></svg>关于</div>
  </div>

  <div class="content">
    <div class="section">
      <h3>触发方式</h3>
      <div class="row">
        <div><div class="label2">按住说话</div><div class="desc">按住不放开始，松开结束并输入</div></div>
        <div class="keys"><kbd>Alt</kbd><kbd>Space</kbd></div>
      </div>
      <div class="row">
        <div><div class="label2">双击触发</div><div class="desc">连按两下开始，再按一下结束</div></div>
        <div class="switch off"></div>
      </div>
    </div>
    <div class="section">
      <h3>识别</h3>
      <div class="row">
        <div><div class="label2">语言</div><div class="desc">留空为自动检测</div></div>
        <select class="fake"><option>中文 / 英文（自动）</option></select>
      </div>
      <div class="row">
        <div><div class="label2">中英文标点自动修正</div><div class="desc">识别后自动整理标点与空格</div></div>
        <div class="switch"></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
